<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 반 제출 체크</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF8F1; --surface:#FFFFFF; --idle:#FFFFFF; --ink:#1F2A44; --muted:#667085;
  --line:#E6E0D2; --soft:#F2EDE2; --ok:#1F9D6B; --danger:#D23B3B; --primary:#1F2A44;
  --shadow:0 3px 0 rgba(31,42,68,.10);
  --display:"Jua","Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131926; --surface:#1C2433; --idle:#212A3B; --ink:#EEF1F7; --muted:#9AA3B5;
    --line:#2F3A50; --soft:#263044; --primary:#EEF1F7; --shadow:0 3px 0 rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#131926; --surface:#1C2433; --idle:#212A3B; --ink:#EEF1F7; --muted:#9AA3B5;
  --line:#2F3A50; --soft:#263044; --primary:#EEF1F7; --shadow:0 3px 0 rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background-color:var(--bg);background-image:radial-gradient(color-mix(in srgb,var(--ink) 9%,transparent) 1.5px,transparent 1.6px);background-size:26px 26px;color:var(--ink);font-family:var(--body);
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:4px solid #F2B705;outline-offset:3px}

#app{height:100%;display:flex;flex-direction:column;padding:clamp(10px,1.4vw,24px);gap:clamp(8px,1.2vh,16px)}

/* header */
.top{display:flex;align-items:center;gap:clamp(12px,2vw,32px)}
.date{font-family:var(--display);font-size:clamp(28px,3.6vw,60px);line-height:1;white-space:nowrap;background:var(--surface);border:3px solid var(--line);border-radius:22px;padding:.22em .5em;box-shadow:inset 0 3px 0 rgba(255,255,255,.7),0 6px 0 var(--line),0 10px 16px rgba(31,42,68,.1)}
.progress{flex:1;display:flex;align-items:center;gap:16px;min-width:0}
.pcount{font-family:var(--display);font-size:clamp(22px,2.6vw,44px);white-space:nowrap}
.pcount b{display:inline-block;color:var(--c,var(--ok));text-shadow:0 3px 0 rgba(31,42,68,.15)}
.pcount b{font-size:1.25em}
.pbar{flex:1;height:clamp(22px,2.8vh,38px);background:var(--soft);border-radius:99px;overflow:hidden;border:3px solid var(--line);box-shadow:inset 0 4px 6px rgba(31,42,68,.14),0 4px 0 var(--line)}
#pfill{height:100%;width:0;border-radius:99px;transition:width .45s cubic-bezier(.3,1.4,.5,1);background:linear-gradient(180deg,color-mix(in srgb,var(--c,var(--ok)) 55%,#fff) 0%,var(--c,var(--ok)) 55%,color-mix(in srgb,var(--c,var(--ok)) 75%,#000) 100%);box-shadow:inset 0 3px 0 rgba(255,255,255,.45)}
.tools{display:flex;gap:10px}
.tool{border:2px solid var(--line);background:var(--surface);border-radius:16px;min-height:56px;padding:0 20px;
  font-weight:700;font-size:clamp(16px,1.3vw,22px);box-shadow:inset 0 3px 0 rgba(255,255,255,.7),0 5px 0 var(--line)}
.tool:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.tool.icon{width:56px;padding:0;font-size:26px}

/* tabs */
.tabs{display:flex;gap:clamp(8px,1vw,16px);flex-wrap:wrap}
.tabs{padding-bottom:8px}
.tab{position:relative;display:flex;align-items:center;gap:12px;min-height:clamp(60px,8.5vh,96px);padding:0 clamp(16px,1.8vw,32px);
  border-radius:24px;border:3px solid var(--c);background:var(--surface);color:var(--c);
  font-family:var(--display);font-size:clamp(22px,2.4vw,42px);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.7),0 7px 0 color-mix(in srgb,var(--c) 45%,var(--surface)),0 12px 18px rgba(31,42,68,.12);transition:transform .09s,box-shadow .09s}
.tab:active{transform:translateY(5px);box-shadow:0 2px 0 color-mix(in srgb,var(--c) 45%,var(--surface))}
.tab .ti{font-size:1.15em;filter:drop-shadow(0 3px 0 rgba(0,0,0,.15))}
.tab .ti{font-size:1.1em}
.tab .tc{font-family:var(--display);font-size:.55em;padding:4px 12px;border-radius:99px;background:var(--soft);color:var(--ink)}
.tab.on{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 78%,#fff),var(--c));color:#fff;text-shadow:0 2px 0 color-mix(in srgb,var(--c) 60%,#000);box-shadow:inset 0 3px 0 rgba(255,255,255,.4),0 7px 0 color-mix(in srgb,var(--c) 65%,#000),0 12px 18px rgba(31,42,68,.2)}
.tab.on .tc{background:rgba(255,255,255,.25);color:#fff}

/* board */
main{flex:1;min-height:0}
.grid{height:100%;display:grid;column-gap:clamp(10px,1.1vw,18px);row-gap:clamp(10px,1.4vh,18px);padding:10px 8px 4px 4px}
.stu{--h:200;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;min-height:0;
  border-radius:clamp(16px,1.6vw,30px);border:3px solid oklch(0.82 0.08 var(--h));
  background:oklch(0.94 0.05 var(--h));color:oklch(0.36 0.11 var(--h));
  padding:6px;transition:transform .09s ease,background .2s}
.stu:active{transform:scale(.97)}
.stu .num{position:absolute;z-index:1;top:8px;left:10px;font-family:var(--display);font-size:calc(var(--fs) * .44);line-height:1;
  min-width:1.6em;height:1.6em;display:flex;align-items:center;justify-content:center;border-radius:50%;
  background:oklch(0.99 0.01 var(--h));color:oklch(0.45 0.12 var(--h))}
.stu .nm{position:relative;font-family:var(--display);font-weight:400;font-size:var(--fs);line-height:1.05;white-space:nowrap;letter-spacing:0;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.stu .nm.long{font-size:calc(var(--fs) * .78)}
.stu .tm{position:relative;font-family:var(--display);font-size:calc(var(--fs) * .38);margin-top:.2em;min-height:1.1em}
.stu .ck{position:absolute;top:-10px;right:-8px;width:calc(var(--fs) * 1);height:calc(var(--fs) * 1);border-radius:50%;
  display:none;align-items:center;justify-content:center;background:#FFD43B;color:#7A4B00;font-size:calc(var(--fs) * .62);font-weight:800;
  border:3px solid #fff;transform:rotate(-12deg);z-index:2}
.stu.done{border-color:oklch(0.50 0.15 var(--h));color:#fff;background:oklch(0.60 0.16 var(--h))}
.stu.done .num{background:rgba(255,255,255,.95);color:oklch(0.45 0.15 var(--h))}
.stu.done .ck{display:flex}
.stu.pop{animation:pop .45s ease}
.stu.pop .ck{animation:stamp .45s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes stamp{0%{transform:scale(2.2) rotate(-30deg);opacity:0}60%{transform:scale(.9) rotate(-8deg);opacity:1}100%{transform:scale(1) rotate(-12deg)}}
.grid.empty{display:flex;align-items:center;justify-content:center}
.emptymsg{text-align:center;font-family:var(--display);font-size:clamp(28px,3vw,48px);color:var(--muted)}
.emptymsg small{display:block;font-family:var(--body);font-weight:700;font-size:.5em;margin-top:12px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;
  display:flex;align-items:center;gap:20px;background:var(--primary);color:var(--bg);border-radius:22px;
  padding:14px 14px 14px 28px;font-weight:800;font-size:clamp(20px,2vw,34px);box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:92vw}
.toast[hidden]{display:none}
.toast button{border:0;border-radius:16px;background:var(--bg);color:var(--ink);font-weight:800;font-size:.85em;padding:12px 26px;min-height:56px}

/* overlay + modal */
.overlay{position:fixed;inset:0;z-index:80;background:rgba(15,20,32,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.overlay[hidden]{display:none}
.modal{background:var(--surface);color:var(--ink);border-radius:28px;padding:clamp(20px,3vw,40px);width:min(620px,100%);max-height:92vh;overflow:auto;
  box-shadow:0 20px 60px rgba(0,0,0,.3);user-select:text}
.modal.wide{width:min(1200px,100%)}
.modal h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,2.8vw,46px);margin:0 0 12px}
.modal p{font-size:clamp(18px,1.4vw,24px);line-height:1.5;margin:0 0 16px}
.mbtns{display:flex;gap:14px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.muted{color:var(--muted)}

.btn{border:2px solid var(--primary);background:var(--primary);color:var(--bg);border-radius:14px;padding:10px 20px;min-height:48px;font-weight:800;font-size:17px}
.btn.big{min-height:72px;padding:0 36px;font-size:clamp(20px,1.8vw,28px);border-radius:20px}
.btn.sm{min-height:40px;padding:6px 14px;font-size:15px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger.ghost{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn.primary{background:var(--ok);border-color:var(--ok);color:#fff}

/* pin */
.pindots{display:flex;gap:18px;justify-content:center;margin:10px 0 24px}
.pindots i{width:26px;height:26px;border-radius:50%;border:3px solid var(--ink)}
.pindots i.on{background:var(--ink)}
.pindots.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.key{min-height:78px;border-radius:18px;border:2px solid var(--line);background:var(--soft);font-family:var(--display);font-size:34px}
.key[data-k="닫기"],.key[data-k="⌫"]{font-family:var(--body);font-weight:800;font-size:22px}

/* missing overlay */
.misslist{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px}
.misslist span{font-weight:800;font-size:clamp(28px,3vw,52px);padding:10px 24px;border-radius:18px;border:3px solid var(--c);color:var(--ink)}
.misslist span small{font-size:.5em;color:var(--muted);margin-right:8px}

/* teacher panel */
.teacher{position:fixed;inset:0;z-index:60;background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);user-select:text}
.teacher[hidden]{display:none}
.tpanel{display:grid;grid-template-columns:260px 1fr;height:100%}
.tside{background:var(--surface);border-right:2px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:8px;overflow:auto}
.tside h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0 8px 16px}
.sidebtn{text-align:left;border:0;background:transparent;border-radius:14px;padding:14px 16px;font-weight:800;font-size:19px;min-height:56px}
.sidebtn.on{background:var(--primary);color:var(--bg)}
.sidebtn.close{margin-top:auto;border:2px solid var(--line)}
.tbody{overflow:auto;padding:28px clamp(16px,3vw,48px) 60px}
.tbody h3{font-family:var(--display);font-weight:400;font-size:30px;margin:28px 0 8px}
.tbody h3:first-child{margin-top:0}
.tbody p{font-size:17px;line-height:1.55;max-width:70ch;margin:0 0 14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.in,select,textarea,input[type=date]{font:inherit;font-size:17px;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:8px 12px;min-height:46px}
.in.num{width:80px}
textarea{width:100%;max-width:640px;resize:vertical}
.copybox{width:100%;max-width:none;height:320px;font-family:ui-monospace,monospace;font-size:14px}
.tblwrap{overflow-x:auto;max-width:100%}
.tbl{border-collapse:collapse;font-size:17px;margin:10px 0 16px}
.tbl th,.tbl td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl th{color:var(--muted);font-weight:700;font-size:15px}
.tbl tr.inactive td{opacity:.5}
.tbl tr.inactive td:nth-child(3){opacity:1}
.cell{min-width:74px;min-height:40px;border-radius:10px;border:2px solid var(--line);background:var(--soft);font-weight:800;font-size:15px}
.cell.on{background:var(--c);border-color:var(--c);color:#fff}
.cell .nt{display:block;font-size:12px;font-weight:700}
.clickrow{cursor:pointer}
.clickrow:hover td{background:var(--soft)}

.itemcard{background:var(--surface);border:2px solid var(--line);border-left:10px solid var(--c);border-radius:18px;padding:16px 18px;margin:12px 0;display:grid;gap:12px;max-width:900px}
.itemcard .row{margin:0}
.daybtn{min-width:48px;min-height:46px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:800}
.daybtn.on{background:var(--c);border-color:var(--c);color:#fff}
input[type=color]{width:56px;height:46px;border:2px solid var(--line);border-radius:12px;padding:2px;background:var(--surface)}
.in.icon{width:70px;text-align:center;font-size:22px}
.lbl{font-weight:700;font-size:15px;color:var(--muted)}

.subtabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.subtabs button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 18px;font-weight:800;font-size:17px;min-height:48px}
.subtabs button.on{background:var(--primary);color:var(--bg);border-color:var(--primary)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;max-width:820px}
.cal .hd{text-align:center;font-weight:800;color:var(--muted);padding:6px 0}
.cal .d{aspect-ratio:1.15;border-radius:14px;border:2px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:8px;font-weight:800;font-size:17px}
.cal .d.has{background:color-mix(in srgb,var(--ok) calc(var(--r) * 85% + 8%),var(--surface))}
.cal .d.has.hi{color:#fff}
.cal .d.today{outline:3px solid #F2B705}
.cal .d small{font-size:14px}
.chip{display:inline-block;padding:4px 10px;border-radius:99px;background:var(--soft);font-weight:700;font-size:15px;margin:3px}
.misshead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:8px 0}
.misshead b{font-family:var(--display);font-weight:400;font-size:24px;color:var(--c)}

#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}
.cheer{position:fixed;inset:0;z-index:85;display:flex;align-items:center;justify-content:center;pointer-events:none}
.cheer div{font-family:var(--display);font-size:clamp(48px,7vw,120px);color:#fff;background:var(--c);padding:24px 60px;border-radius:40px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .6s ease}

@media (max-width:760px){
  .tpanel{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .tside{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:2px solid var(--line);padding:10px}
  .tside h2{display:none}
  .sidebtn{white-space:nowrap}
  .sidebtn.close{margin-top:0}
  .top{flex-wrap:wrap}
  body{overflow:auto}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="date" id="date"></div>
    <div class="progress">
      <div class="pcount" id="pcount"></div>
      <div class="pbar"><div id="pfill"></div></div>
    </div>
    <div class="tools">
      <button id="btnMissing" class="tool">미제출 보기</button>
      <button id="btnFull" class="tool icon" aria-label="전체화면">⛶</button>
      <button id="btnTeacher" class="tool icon" aria-label="교사 모드">⚙</button>
    </div>
  </header>
  <nav class="tabs" id="tabs" aria-label="제출 항목"></nav>
  <main><div id="grid" class="grid"></div></main>
</div>
<div id="toast" class="toast" hidden></div>
<div id="teacher" class="teacher" hidden></div>
<div id="overlay" class="overlay" hidden></div>
<canvas id="confetti"></canvas>

<script>
(function(){
const KEY='subcheck:v1';
const DAYS=['일','월','화','수','목','금','토'];
const NAMES=['김하늘','이서준','박지우','최하윤','정도윤','강서아','조시우','윤지호','장수아','임하준','한지유','오은우','서윤서','신건우','권채원','황민준','안예린','송유찬','전소율','홍주원','유다은','고태윤','문가온','양서진','배하람'];
const PALETTE=['#1F9D6B','#3566D6','#D6457A','#E07B00','#7B4FD6','#0E9AA7','#C0392B'];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Math.random().toString(36).slice(2,9);
const safeColor=c=>/^#[0-9a-f]{6}$/i.test(c)?c:'#3566D6';

function seed(){
  return {version:1,pin:'0000',sound:true,
    students:NAMES.map((n,i)=>({id:uid('s'),number:i+1,name:n,active:true})),
    items:[
      {id:uid('i'),name:'아침활동',icon:'🌅',color:'#1F9D6B',days:[1,2,3,4,5],start:'',end:''},
      {id:uid('i'),name:'안내장',icon:'📄',color:'#3566D6',days:[1,2,3,4,5],start:'',end:''},
      {id:uid('i'),name:'감사일기',icon:'💖',color:'#D6457A',days:[1,3,5],start:'',end:''}],
    records:{}};
}
let S;
function valid(d){return d&&Array.isArray(d.students)&&Array.isArray(d.items)&&typeof d.records==='object'}
function load(){
  try{const r=localStorage.getItem(KEY); if(r){const d=JSON.parse(r); if(valid(d)){S=d;return;}}}catch(e){}
  S=seed(); save();
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));}
  catch(e){notice('이 기기에 저장하지 못했어요. 설정에서 백업 파일을 내려받아 두세요.');}
}

/* dates */
const dkey=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parseKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const prettyDate=k=>{const d=parseKey(k);return `${d.getMonth()+1}월 ${d.getDate()}일 ${DAYS[d.getDay()]}요일`};
const shortDate=k=>{const d=parseKey(k);return `${d.getMonth()+1}/${d.getDate()}(${DAYS[d.getDay()]})`};
function itemsOn(k){const wd=parseKey(k).getDay();return S.items.filter(it=>(it.days||[]).includes(wd)&&(!it.start||k>=it.start)&&(!it.end||k<=it.end))}
function itemsForRecord(k){const on=itemsOn(k);const ids=new Set(on.map(i=>i.id));const rec=S.records[k]||{};S.items.forEach(it=>{if(!ids.has(it.id)&&rec[it.id]&&Object.keys(rec[it.id]).length){on.push(it);ids.add(it.id)}});return on}
const activeStudents=()=>S.students.filter(s=>s.active).sort((a,b)=>a.number-b.number);
const stu=id=>S.students.find(s=>s.id===id);
const getRec=(k,iid,sid)=>S.records[k]&&S.records[k][iid]&&S.records[k][iid][sid];
const isSub=r=>!!(r&&r.submitted);
function setRec(k,iid,sid,val){
  if(!S.records[k])S.records[k]={};
  if(!S.records[k][iid])S.records[k][iid]={};
  if(val&&(val.submitted||val.note))S.records[k][iid][sid]=val; else delete S.records[k][iid][sid];
  save();
}
const nowTime=()=>{const t=new Date();return t.getHours()+':'+String(t.getMinutes()).padStart(2,'0')};

/* ---------- student screen ---------- */
let today=dkey(), curItem=null;
function renderMain(){
  today=dkey();
  $('#date').textContent=prettyDate(today);

function renderGrid(){
  const g=$('#grid'); const it=S.items.find(i=>i.id===curItem); const studs=activeStudents();

  if(!it){g.className='grid empty';g.innerHTML='<div class="emptymsg">오늘은 제출할 항목이 없어요<small>교사 모드 → 제출 항목에서 추가할 수 있어요</small></div>';progress(0,0,null);return;}
  if(!studs.length){g.className='grid empty';g.innerHTML='<div class="emptymsg">학생 명단이 비어 있어요<small>교사 모드 → 학생 명단에서 등록하세요</small></div>';progress(0,0,null);return;}
  g.className='grid'; g.style.setProperty('--c',safeColor(it.color));

    return `<button class="stu ${on?'done':''}" style="--h:${Math.round((s.number*137.508+20)%360)}" data-id="${s.id}" aria-pressed="${on}"><span class="num">${s.number}</span><span class="nm ${[...s.name].length>3?'long':''}">${esc(s.name)}</span><span class="tm">${on&&r.time?esc(r.time):''}</span><span class="ck" aria-hidden="true">✔</span></button>`;
  }).join('');

function progress(done,total,color){
  $('#pcount').style.setProperty('--c',color?safeColor(color):'var(--ok)');$('#pcount').innerHTML=total?`<b>${done}</b> / ${total}명 제출`:'';
  const f=$('#pfill'); f.style.width=total?(done/total*100)+'%':'0'; f.style.setProperty('--c',color?safeColor(color):'var(--ok)');
}
function fitGrid(){
  const g=$('#grid'); const n=g.querySelectorAll('.stu').length; if(!n)return;
  const cs=getComputedStyle(g),W=g.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),H=g.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom),cg=parseFloat(cs.columnGap)||12,rg=parseFloat(cs.rowGap)||16;
  let best=null;
  for(let c=1;c<=n;c++){
    const r=Math.ceil(n/c),w=(W-cg*(c-1))/c,h=(H-rg*(r-1))/r;
    if(w<=0||h<=0)continue;
    const s=Math.min(w/1.6,h);
    if(!best||s>best.s)best={c,r,w,h,s};
  }
  if(!best)return;
  g.style.gridTemplateColumns=`repeat(${best.c},minmax(0,1fr))`;
  g.style.gridTemplateRows=`repeat(${best.r},minmax(0,1fr))`;
  g.style.setProperty('--fs',Math.max(18,Math.min(best.h*0.34,best.w/4))+'px');
}

/* sound */
let AC;
function chime(){
  if(!S.sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime;
    [660,990].forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;
      const s=t+i*.09;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.22,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+.28);
      o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+.3);});
  }catch(e){}
}

/* celebration */
function celebrate(it){
  const c=it?safeColor(it.color):'#1F9D6B';
  const d=document.createElement('div');d.className='cheer';d.style.setProperty('--c',c);
  d.innerHTML=`<div>${esc(it?it.name:'')} 모두 제출! 🎉</div>`;document.body.appendChild(d);setTimeout(()=>d.remove(),2600);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cv=$('#confetti'),ctx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
  const cols=[c,'#F2B705','#3566D6','#D6457A','#1F9D6B','#ffffff'];
  const P=Array.from({length:180},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*4,vy:3+Math.random()*5,r:6+Math.random()*8,a:Math.random()*6,va:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)]}));
  const end=Date.now()+3000;
  (function frame(){ctx.clearRect(0,0,cv.width,cv.height);
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=p.va;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);ctx.restore();});
    if(Date.now()<end)requestAnimationFrame(frame);else ctx.clearRect(0,0,cv.width,cv.height);})();
}

/* records */
function dayRate(k){
  if(!S.records[k])return null;
  const items=itemsForRecord(k),st=activeStudents(),total=items.length*st.length;
  if(!total)return null;
  let done=0;items.forEach(it=>st.forEach(s=>{if(isSub(getRec(k,it.id,s.id)))done++;}));
  return done/total;
}
function tRecords(el){
  el.innerHTML=`<h3>제출 기록</h3><div class="subtabs">${[['cal','달력'],['day','날짜별'],['stu','학생별']].map(([k,l])=>`<button class="${recView===k?'on':''}" data-v="${k}">${l}</button>`).join('')}</div><div id="rv"></div>`;
  el.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{recView=b.dataset.v;tRecords(el);});
  const rv=el.querySelector('#rv');
  if(recView==='cal')recCal(rv,el);else if(recView==='day')recDay(rv,el);else recStu(rv,el);
}
function recCal(rv,el){
  const base=calMonth||today.slice(0,7);const [y,m]=base.split('-').map(Number);
  const first=new Date(y,m-1,1),dim=new Date(y,m,0).getDate();
  let cells=DAYS.map(d=>`<div class="hd">${d}</div>`).join('')+'<div></div>'.repeat(first.getDay());
  for(let d=1;d<=dim;d++){
    const k=dkey(new Date(y,m-1,d)),r=dayRate(k);
    cells+=`<button class="d ${r!=null?'has':''} ${r!=null&&r>.55?'hi':''} ${k===today?'today':''}" style="--r:${r||0}" data-k="${k}"><span>${d}</span>${r!=null?`<small>${Math.round(r*100)}%</small>`:''}</button>`;
  }
  rv.innerHTML=`<div class="row"><button class="btn sm ghost" data-m="-1" aria-label="이전 달">◀</button><b style="font-size:22px;min-width:130px;text-align:center">${y}년 ${m}월</b><button class="btn sm ghost" data-m="1" aria-label="다음 달">▶</button></div>
  <p class="muted">색이 진할수록 제출률이 높아요. 날짜를 누르면 그날 내역을 볼 수 있어요.</p><div class="cal">${cells}</div>`;
  rv.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const d=new Date(y,m-1+Number(b.dataset.m),1);calMonth=dkey(d).slice(0,7);tRecords(el);});
  rv.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{recDate=b.dataset.k;recView='day';tRecords(el);});
}
function recDay(rv,el){
  const k=recDate,items=itemsForRecord(k),st=activeStudents();
  rv.innerHTML=`<div class="row"><input type="date" id="rd" value="${k}"><b style="font-size:20px">${prettyDate(k)}</b></div>
  ${items.length?items.map(it=>{const miss=st.filter(s=>!isSub(getRec(k,it.id,s.id)));return `<div class="misshead" style="--c:${safeColor(it.color)}"><b>${esc(it.icon)} ${esc(it.name)}</b><span>${st.length-miss.length}/${st.length}명 제출</span></div><div>${miss.length?'미제출: '+miss.map(s=>`<span class="chip">${s.number} ${esc(s.name)}</span>`).join(''):'<span class="chip">모두 제출</span>'}</div>`;}).join('')
  :'<p class="muted">이날은 제출 항목이 없어요.</p>'}
  ${items.length?`<p class="muted" style="margin-top:20px">칸을 누르면 교사가 대신 제출·취소하거나 메모(예: 결석)를 남길 수 있어요.</p>
  <div class="tblwrap"><table class="tbl"><thead><tr><th>번호</th><th>이름</th>${items.map(it=>`<th>${esc(it.name)}</th>`).join('')}</tr></thead><tbody>
  ${st.map(s=>`<tr><td>${s.number}</td><td>${esc(s.name)}</td>${items.map(it=>{const r=getRec(k,it.id,s.id),on=isSub(r);return `<td><button class="cell ${on?'on':''}" style="--c:${safeColor(it.color)}" data-s="${s.id}" data-i="${it.id}">${on?'✔ '+esc(r.time||''):'—'}${r&&r.note?`<span class="nt">${esc(r.note)}</span>`:''}</button></td>`;}).join('')}</tr>`).join('')}
  </tbody></table></div>`:''}`;
  rv.querySelector('#rd').onchange=e=>{if(e.target.value){recDate=e.target.value;tRecords(el);}};
  rv.querySelectorAll('.cell').forEach(b=>b.onclick=()=>editCell(k,b.dataset.i,b.dataset.s,()=>tRecords(el)));
}
function editCell(k,iid,sid,done){
  const s=stu(sid),it=S.items.find(i=>i.id===iid),r=getRec(k,iid,sid)||{};let sub=!!r.submitted;
  const m=modal(`<h2>${s.number}번 ${esc(s.name)}</h2><p class="muted">${esc(it.name)} · ${prettyDate(k)}</p>
  <div class="row"><button class="btn big" data-v="1">제출</button><button class="btn big" data-v="0">미제출</button></div>
  <div class="row"><input class="in" id="note" placeholder="메모 (예: 결석, 내일 가져옴)" value="${esc(r.note||'')}" style="flex:1"></div>
  <div class="mbtns"><button class="btn big ghost" data-x>닫기</button><button class="btn big primary" data-save>저장</button></div>`);
  const paint=()=>m.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('ghost',(b.dataset.v==='1')!==sub));paint();
  m.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{sub=b.dataset.v==='1';paint();});
  m.querySelector('[data-x]').onclick=closeModal;
  m.querySelector('[data-save]').onclick=()=>{
    const note=m.querySelector('#note').value.trim();
    setRec(k,iid,sid,{submitted:sub,time:sub?(r.submitted&&r.time?r.time:'교사'):'',note});closeModal();done();
  };
}
function recStu(rv,el){
  const days=Object.keys(S.records).sort(),st=activeStudents();
  const stat=(s,it)=>{let tot=0,miss=[];days.forEach(k=>{if(!itemsForRecord(k).includes(it))return;tot++;if(!isSub(getRec(k,it.id,s.id)))miss.push(k);});return {tot,miss};};
  let html=`<p class="muted">기록이 있는 날을 기준으로 센 누적 미제출 횟수예요. 학생을 누르면 미제출 날짜를 볼 수 있어요.</p>
  <div class="tblwrap"><table class="tbl"><thead><tr><th>번호</th><th>이름</th>${S.items.map(it=>`<th>${esc(it.name)} 미제출</th>`).join('')}</tr></thead><tbody>
  ${st.map(s=>`<tr class="clickrow" data-s="${s.id}"><td>${s.number}</td><td><b>${esc(s.name)}</b></td>${S.items.map(it=>{const x=stat(s,it);return `<td>${x.tot?`${x.miss.length}회 <span class="muted">/ ${x.tot}일</span>`:'—'}</td>`;}).join('')}</tr>`).join('')}
  </tbody></table></div>`;
  const sel=recStudent&&stu(recStudent);
  if(sel){html+=`<h3>${sel.number}번 ${esc(sel.name)}</h3>`+S.items.map(it=>{const x=stat(sel,it);return `<div class="misshead" style="--c:${safeColor(it.color)}"><b>${esc(it.icon)} ${esc(it.name)}</b><span>${x.tot-x.miss.length}/${x.tot}일 제출</span></div><div>${x.miss.length?x.miss.map(k=>{const r=getRec(k,it.id,sel.id);return `<span class="chip">${shortDate(k)}${r&&r.note?' · '+esc(r.note):''}</span>`;}).join(''):'<span class="chip">미제출 없음</span>'}</div>`;}).join('');}
  rv.innerHTML=html;
  rv.querySelectorAll('[data-s]').forEach(r=>r.onclick=()=>{recStudent=r.dataset.s;tRecords(el);});
}

/* settings */
function tSettings(el){
  el.innerHTML=`<h3>비밀번호</h3><p class="muted">교사 모드에 들어갈 때 쓰는 숫자 4자리예요.</p>
  <div class="row"><input class="in" id="pin" inputmode="numeric" maxlength="4" placeholder="새 비밀번호 4자리" style="width:200px"><button class="btn" id="pinSave">비밀번호 바꾸기</button></div>
  <h3>효과음</h3><div class="row"><button class="btn ${S.sound?'':'ghost'}" id="snd">${S.sound?'효과음 켜짐':'효과음 꺼짐'}</button></div>
  <h3>기록 내보내기</h3><p class="muted">날짜, 번호, 이름, 항목, 제출 여부, 제출 시각, 메모를 엑셀에서 열 수 있는 CSV 파일로 받아요.</p>
  <div class="row"><button class="btn" id="csv">CSV 파일 받기</button></div>
  <h3>백업과 복원</h3><p class="muted">기록은 이 전자칠판의 브라우저에만 저장돼요. 브라우저 기록을 지우면 사라질 수 있으니 주기적으로 백업 파일을 받아 두세요. 다른 기기로 옮길 때도 이 파일을 쓰면 돼요.</p>
  <div class="row"><button class="btn" id="bak">백업 파일 받기</button><label class="btn ghost" style="display:inline-flex;align-items:center;cursor:pointer">백업 파일로 복원<input type="file" id="res" accept=".json,application/json" hidden></label></div>
  <h3>처음 상태로</h3><p class="muted">명단, 항목, 모든 기록을 지우고 예시 데이터로 되돌려요.</p>
  <div class="row"><button class="btn danger ghost" id="reset">전체 초기화</button></div>`;
  el.querySelector('#pinSave').onclick=()=>{const v=el.querySelector('#pin').value.trim();if(!/^\d{4}$/.test(v)){notice('숫자 4자리를 입력하세요.');return;}S.pin=v;save();notice('비밀번호를 바꿨어요.');el.querySelector('#pin').value='';};
  el.querySelector('#snd').onclick=()=>{S.sound=!S.sound;save();tSettings(el);if(S.sound)chime();};
  el.querySelector('#csv').onclick=()=>offerFile(`제출기록_${today}.csv`,buildCSV());
  el.querySelector('#bak').onclick=()=>offerFile(`제출체크_백업_${today}.json`,JSON.stringify(S,null,1));
  el.querySelector('#res').onchange=e=>{
    const f=e.target.files[0];if(!f)return;const fr=new FileReader();
    fr.onload=()=>{let d;try{d=JSON.parse(fr.result);}catch(err){notice('백업 파일을 읽지 못했어요. 이 앱에서 받은 .json 파일인지 확인하세요.');return;}
      if(!valid(d)){notice('이 앱의 백업 파일이 아니에요.');return;}
      ask('백업 파일로 복원할까요?',`지금 데이터가 백업 파일 내용(학생 ${d.students.length}명, 항목 ${d.items.length}개)으로 바뀌어요.`,'복원',()=>{d.items.forEach(i=>i.color=safeColor(i.color));S=d;if(!S.pin)S.pin='0000';save();notice('복원했어요.');renderTeacher();},true);};
    fr.readAsText(f);e.target.value='';
  };
  el.querySelector('#reset').onclick=()=>ask('전체 초기화할까요?','모든 명단과 기록이 지워져요. 먼저 백업 파일을 받아 두는 걸 권해요.','초기화',()=>{S=seed();save();notice('처음 상태로 되돌렸어요.');renderTeacher();},true);
}
function buildCSV(){
  const q=v=>{v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const rows=[['날짜','번호','이름','항목','제출','제출시각','메모']];
  const studs=[...S.students].sort((a,b)=>a.number-b.number);
  Object.keys(S.records).sort().forEach(k=>itemsForRecord(k).forEach(it=>studs.forEach(s=>{
    const r=getRec(k,it.id,s.id);
    if(!s.active&&!r)return;
    rows.push([k,s.number,s.name,it.name,isSub(r)?'O':'X',r&&r.time||'',r&&r.note||'']);
  })));
  return '\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n');
}

/* downloads */
let DL=null;
(async()=>{try{if(window.claude&&typeof window.claude.use==='function')DL=await window.claude.use('downloads');}catch(e){DL=null;}})();
async function offerFile(name,data){
  if(DL){
    try{await DL.save({filename:name,data});notice('파일을 저장했어요.');return;}
    catch(e){const c=e&&e.code;if(c==='declined')return;if(c==='rate_limited'){notice('잠시 후 다시 눌러 주세요.');return;}}
  }
  const m=modal(`<h2>${esc(name)}</h2><p class="muted">이 화면에서는 파일을 바로 저장할 수 없어요. 아래 내용을 모두 복사해 메모장에 붙여넣고 "${esc(name)}" 이름으로 저장하세요.</p><textarea class="copybox" readonly>${esc(data)}</textarea><div class="mbtns"><button class="btn big ghost" data-x>닫기</button><button class="btn big primary" data-c>모두 복사</button></div>`,true);
  m.querySelector('[data-x]').onclick=closeModal;
  m.querySelector('[data-c]').onclick=async()=>{const ta=m.querySelector('textarea');ta.select();try{await navigator.clipboard.writeText(data);}catch(e){try{document.execCommand('copy');}catch(_){}}notice('복사했어요.');};
}

/* boot */
load();
renderMain();
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(fitGrid,120);});
setInterval(()=>{if(dkey()!==today&&$('#teacher').hidden)renderMain();},30000);
})();
</script>
